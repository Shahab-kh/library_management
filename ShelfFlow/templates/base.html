{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />

    <title>{% block title %} Shelf Flow {% endblock %}</title>
  </head>
  <header>
    <div class="header-left">
      <img
        src="{% static 'images/ShelfFlow-logo.png' %}"
        class="logo"
        alt="ShelfFlow"
      />
      <nav>
        <a href="">Dashboard</a>
        <a href="{% url 'book_list' %}">Books</a>
        <a href="">Members</a>
      </nav>
    </div>

    <form method="GET" action="{% url 'book_list' %}" class="search-form">
      <div class="search-box">
        <input type="text" name="q" placeholder="  Search books..." />
        <button type="submit" class="search-button">
          <i class="bi bi-search"></i>
        </button>
      </div>
    </form>
  </header>
  <body>
    {% block content %} {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% if messages %}
    <div class="snackbar-container">
      {% for message in messages %}

      <div class="snackbar snackbar-{{ message.tags }}">
        <span class="snackbar-icon">
          {% if message.tags == "success" %} ✓ {% else %} ! {% endif %}
        </span>

        <span>{{ message }}</span>
      </div>

      {% endfor %}
    </div>
    {% endif %}
    <script>
      setTimeout(() => {
        const snackbar = document.querySelector(".snackbar");

        if (snackbar) {
          snackbar.style.opacity = "0";
          snackbar.style.transform = "translateX(100px)";

          setTimeout(() => {
            snackbar.remove();
          }, 300);
        }
      }, 3000);
    </script>
  </body>
</html>
