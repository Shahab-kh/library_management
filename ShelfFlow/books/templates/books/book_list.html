{% extends "base.html" %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book List</title>
  </head>
  <body>
    {% block content %}
    <h3 class="title_Book">Books</h3>
    <ul style="list-style: none">
      {% for book in books %}
      <li>
        <img
          src="{{ book.cover_image.url }}"
          style="height: 300px; width: 250px"
        />
        <p>{{ book.title }}</p>
      </li>
      {% endfor %}
    </ul>
    {% endblock %}
  </body>
</html>
