{% extends "base.html" %} {% block content %}

<h3 class="title_Book">Books</h3>

<div class="books-container">
  {% for book in books %}

  <div class="book-card">
    <img
      src="{{ book.cover_image.url }}"
      alt="{{ book.title }}"
      class="book-cover"
    />

    <h5 class="book-title">{{ book.title }}</h5>

    <button class="borrow-button">Borrow</button>
  </div>

  {% endfor %}
</div>

{% endblock %}
